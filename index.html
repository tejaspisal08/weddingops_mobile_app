:root{--bg:#FBF5F4;--surface:#fff;--paper:#FFFCFB;--ink:#2A1E24;--muted:#776670;--line:#EEDDDF;--accent:#963F55;--accent2:#C9758A;--tint:#F7E2E6;
--ok:#2F7048;--okbg:#E1F0E5;--warn:#94600F;--warnbg:#FBEFD6;--bad:#A92F3F;--badbg:#F9E0E3;--on:#fff;
--serif:"Lora",Georgia,serif;--sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--r:14px;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.flip{transform:scaleX(-1)}
.faint{color:var(--muted);opacity:.8}

/* ---------- frame ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
#rail{position:sticky;top:0;height:100vh;overflow:auto;padding:26px 18px 20px 22px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.brand{padding:0 10px 18px}
.brand b{display:block;font:600 21px var(--serif);color:var(--accent)}
.brand span{display:block;font:italic 15px var(--serif);color:var(--muted)}
.ng{margin-top:12px}
.ng p{margin:0 0 4px;padding:0 10px;font:italic 14px var(--serif);color:var(--muted)}
.ng button{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;padding:6px 10px;border-radius:8px;font-size:15px;color:var(--ink);position:relative}
.ng button:hover{background:var(--tint)}
.ng button[aria-current]{font-weight:650;color:var(--accent)}
.ng button[aria-current]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
.ng button:focus-visible{outline:2.5px solid var(--accent)}
.local{margin:auto 0 0;padding:18px 10px 0;font-size:13px;color:var(--muted)}
main{padding:30px clamp(18px,4vw,48px) 80px;max-width:1120px;width:100%;outline:none}
main.v-seating{max-width:1600px}
#tabs{display:none}
#fab{display:none}

/* ---------- page header ---------- */
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:18px}
.ph h1{font-size:clamp(28px,3.4vw,34px);line-height:1.15}
.sub{margin:6px 0 0;color:var(--muted);font-size:15px;max-width:62ch}
.pa{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.warn,.demo{margin:0 0 16px;padding:10px 14px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:15px}
.demo{background:var(--tint);color:var(--ink)}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link:focus-visible{outline:2.5px solid var(--accent)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn .ic{width:18px;height:18px}
.btn:hover{border-color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:32px;padding:0 10px;font-size:14px}
.btn:active{transform:translateY(1px)}
.icbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.tools.end{justify-content:flex-end;margin-bottom:0}
select,input,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:44px;width:100%;min-width:0;font-size:16px}
textarea{resize:vertical;line-height:1.4}
.tools select{width:auto;max-width:220px}
.search{position:relative;flex:1 1 220px;max-width:340px;display:block}
.search .ic{position:absolute;left:11px;top:11px;width:20px;height:20px;color:var(--muted)}

.segc{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--tint);max-width:100%;overflow-x:auto;scrollbar-width:none;margin:0 0 4px}

.hint{color:var(--muted);font-size:14px;margin:8px 2px}
.para{color:var(--muted);margin:0 0 10px;max-width:66ch}
ul.para{padding-left:20px}
.none{color:var(--muted)}
.pad{padding:12px 4px}
.err{color:var(--bad);font-size:14px;min-height:1em;margin:6px 0 0}

/* ---------- invitation hero ---------- */
.invite{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px;margin:0 0 22px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(90,40,60,.35)}
.iv-in{border:1px solid var(--accent2);outline:1px solid var(--accent2);outline-offset:-6px;padding:34px 20px 30px;text-align:center}
.iv-pre{margin:0;font:italic 16px var(--serif);color:var(--muted)}
.iv-names{font:italic 500 clamp(30px,5vw,46px)/1.1 var(--serif);margin:6px 0 10px;color:var(--ink)}
.amp{display:block;font-size:.62em;color:var(--accent2);margin:2px 0}
.iv-date{margin:0;font-size:16px;letter-spacing:.02em}
.iv-venue{margin:2px 0 0;color:var(--muted)}
.iv-count{margin:18px 0 0;color:var(--muted);font-size:15px}
.iv-count b{font:500 34px var(--serif);color:var(--accent);margin-right:4px;font-variant-numeric:lining-nums}
@media (prefers-reduced-motion:no-preference){.v-today .iv-in{animation:ink .9s var(--ease) both}@keyframes ink{from{opacity:0;letter-spacing:.06em}to{opacity:1;letter-spacing:normal}}}

/* ---------- numbers strip ---------- */
.nums{display:grid;grid-template-columns:repeat(4,1fr);margin:0 0 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.nums div{padding:12px 14px;border-left:1px solid var(--line)}
.nums div:first-child{border-left:0;padding-left:2px}
.nums dt{font-size:13px;color:var(--muted)}
.nums dd{margin:2px 0 0;font:500 26px var(--serif);font-variant-numeric:tabular-nums lining-nums}
.nums dd small{font-size:15px;color:var(--muted)}
.neg{color:var(--bad)!important}

/* ---------- lists ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
.grp{margin:0 0 22px}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 2px 8px;font-size:18px}
.gh small{font:13.5px var(--sans);color:var(--muted)}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.r{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:58px;border-top:1px solid var(--line)}
.r:first-child{border-top:0}
.r.none{padding:14px;color:var(--muted)}
.rb{all:unset;cursor:pointer;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:10px 0;align-self:stretch}
.rb:focus-visible{outline:2.5px solid var(--accent);outline-offset:-2px;border-radius:6px}
.rt{font-weight:550;overflow-wrap:anywhere}
.rs{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.rs .bar{margin-top:6px;max-width:220px}
.rr{display:flex;align-items:center;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:48%}
.r.done .rt{text-decoration:line-through;text-decoration-color:var(--accent2);color:var(--muted)}
.amt{display:flex;flex-direction:column;align-items:flex-end;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.2}
.amt small{font-weight:400;font-size:12.5px;color:var(--muted)}
.tick{flex:none;width:28px;height:28px;border-radius:50%;border:1.6px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:transparent;transition:background .2s,border-color .2s}
.tick .ic{width:16px;height:16px;stroke-width:2.6}
.tick:hover{border-color:var(--ok)}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
@media (prefers-reduced-motion:no-preference){.tick:active{transform:scale(.88)}.tick[aria-pressed="true"] .ic{animation:tk .3s var(--ease)}@keyframes tk{from{transform:scale(.3)}}}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--tint);color:var(--accent)}
.av.b{background:var(--okbg);color:var(--ok)} .av.c{background:var(--warnbg);color:var(--warn)}
.pill{display:inline-flex;align-items:center;border:0;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:650;white-space:nowrap;background:var(--tint);color:var(--ink)}
button.pill{min-height:30px;padding:0 12px}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.bad{background:var(--badbg);color:var(--bad)}
.bar{display:block;height:6px;border-radius:9px;background:var(--line);overflow:hidden;width:100%}
.bar i{display:block;height:100%;border-radius:9px;background:var(--accent2);transition:width .5s var(--ease)}
.bar.ok i{background:var(--ok)} .bar.warn i{background:#d79b35} .bar.bad i{background:var(--bad)}
.prog{margin:0 0 16px}
.prog p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.stars{color:var(--accent2);letter-spacing:1px}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 14px;max-width:46ch;margin-inline:auto}

/* health */
.health{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.score{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.score .big{font:500 54px/1 var(--serif);color:var(--accent)}
.score .of{color:var(--muted)}
.score p{flex-basis:100%;margin:4px 0 0;font-weight:550}
.hl{list-style:none;margin:8px 0 0;padding:0}
.hrow{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;padding:10px 0;border-top:1px solid var(--line);box-sizing:border-box}
.hrow:focus-visible{outline:2.5px solid var(--accent)}
.hk{font-weight:600}
.hn{font-size:13.5px;color:var(--muted);text-align:right}
.hrow .bar{grid-column:1/-1}

/* budget */
.ledger{display:grid;grid-template-columns:auto 1fr auto;gap:10px 28px;align-items:center;padding:18px 0 20px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.ledger p{margin:0;color:var(--muted);font-size:14px}
.ledger b{font:500 42px/1.1 var(--serif);font-variant-numeric:lining-nums}
.ledger .lb .bar{height:10px;margin-bottom:6px}
.ledger dl{margin:0;display:flex;gap:22px}
.ledger dt{font-size:13px;color:var(--muted)}
.ledger dd{margin:0;font-weight:650;font-size:18px;font-variant-numeric:tabular-nums}
.cats{list-style:none;margin:0;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

.cats b{font-variant-numeric:tabular-nums}

/* forms */
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:0 0 18px}
.fl{display:flex;flex-direction:column;gap:4px;min-width:0}

.inline{display:flex;gap:12px;align-items:flex-end;margin:0 0 18px}
.inline .fl{max-width:200px}
.inline .hint{margin:0 0 12px}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 22px}
.calh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.calh h2{font-size:20px}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:12.5px;font-weight:650;color:var(--muted);padding:4px 0}
.cg button{all:unset;cursor:pointer;min-height:78px;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:3px;background:var(--bg);overflow:hidden;box-sizing:border-box}
.cg button b{font-size:13.5px;font-weight:650}
.cg button.today b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on)}
.cg button.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cg button.wed{background:var(--tint)}
.cg button:focus-visible{outline:2.5px solid var(--accent)}
.dots{display:none;gap:3px}
.dots i,.kd{width:7px;height:7px;border-radius:50%;background:var(--accent2);display:block;flex:none}
.dots i.t,.kd.t{background:var(--ok)} .dots i.p,.kd.p{background:#d79b35} .dots i.w,.kd.w{background:var(--accent)}
.chips em{display:block;font-style:normal;font-size:11.5px;line-height:1.3;padding:1px 5px;border-radius:5px;background:var(--surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chips em.t{color:var(--ok)} .chips em.p{color:var(--warn)} .chips em.w{background:var(--accent);color:var(--on)}

/* wedding day */
.sched{list-style:none;margin:0;padding:0;position:relative}
.sched::before{content:"";position:absolute;left:94px;top:16px;bottom:16px;width:1px;background:var(--line)}
.sched li button{all:unset;cursor:pointer;display:grid;grid-template-columns:80px 1fr;gap:28px;padding:12px 8px 12px 0;width:100%;box-sizing:border-box;position:relative;border-radius:10px}
.sched li button:hover{background:var(--tint)}
.sched li button:focus-visible{outline:2.5px solid var(--accent)}
.sched li button::after{content:"";position:absolute;left:90px;top:20px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:1.5px solid var(--accent2)}
.sched time{font:500 18px var(--serif);text-align:right;font-variant-numeric:tabular-nums lining-nums}
.sched b{display:block;font-weight:600}
.sched small{display:block;color:var(--muted);font-size:14px}
.sched li.cer button{background:var(--tint)}
.sched li.cer button::after{background:var(--accent);border-color:var(--accent);width:13px;height:13px;left:88px;top:18px}
.sched li.cer time{color:var(--accent)}

/* style swatches */
.sw{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px}
.sw button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;text-align:center;align-items:center}
.sw button:focus-visible{outline:2.5px solid var(--accent);border-radius:8px}
.sw i{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);margin-bottom:6px;color:var(--muted)}
.swadd i{border:1.5px dashed var(--line);box-shadow:none}
.sw small{color:var(--muted);font-size:13px}
.swp{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.swp button{display:flex;gap:8px;align-items:center;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.swp button[aria-pressed="true"]{border-color:var(--accent)}
.swp i{width:16px;height:16px;border-radius:50%}

/* ---------- seating ---------- */
.seatbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 16px}
.seatbar .tools{margin:0 0 12px}
.zoom{display:inline-flex;align-items:center;gap:6px;margin-left:4px}
.zoom span{min-width:44px;text-align:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.seatwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"bar bar" "canvas tray" "canvas side";grid-template-rows:auto auto 1fr;gap:6px 20px;align-items:start}
.seatbar{grid-area:bar}#canvas{grid-area:canvas}#trayBox{grid-area:tray}.side{grid-area:side}
.canvas{overflow:auto;border-radius:18px;border:1px solid var(--line);background:var(--surface);height:max(460px,calc(100vh - 250px));overscroll-behavior:contain;cursor:grab}
.canvas.panning{cursor:grabbing}
.room{touch-action:none}
.room{display:block;min-width:100%;height:auto;font-family:var(--sans);user-select:none;-webkit-user-select:none}
.floor{fill:var(--paper)}
.gl{stroke:var(--line);stroke-width:1}
.tbl{cursor:grab;transition:transform .55s var(--ease);touch-action:none;outline:none}
.tbl.dragging{transition:none;cursor:grabbing}
.tbl.dragging .top{filter:drop-shadow(0 8px 10px rgba(60,20,40,.25))}
.tbl .top{fill:var(--surface);stroke:var(--line);stroke-width:2;transition:stroke .2s,fill .2s}

.tbl.target .top{stroke:var(--accent2);stroke-dasharray:6 5}

.tn{font-size:15px;font-weight:650;fill:var(--ink);text-anchor:middle;pointer-events:none}
.tc{font-size:12px;fill:var(--muted);text-anchor:middle;pointer-events:none;font-variant-numeric:tabular-nums}
.seat{cursor:grab;touch-action:none}
.seat circle{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.seat.sb circle{fill:var(--ok)} .seat.sc circle{fill:#c08a2c}
.seat.plus circle{opacity:.55}
.seat text{font-size:11px;font-weight:750;fill:var(--on);text-anchor:middle;pointer-events:none;letter-spacing:.02em}
.seat.empty{fill:var(--bg);stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 3}
.seat circle,.seat text{transform-box:fill-box;transform-origin:center}
.fx{cursor:grab;touch-action:none}

.fx-dance rect{fill:url(#gr);fill:var(--tint)}

.fx{transition:transform .55s var(--ease)}
@media (prefers-reduced-motion:no-preference){
 .seat.pop circle,.seat.pop text{animation:pop .5s var(--ease) both;animation-delay:var(--d,0ms)}
 @keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
 .tbl.born .top{animation:born .5s var(--ease)}@keyframes born{from{transform:scale(.5);opacity:0}}
 .tbl.target .top{animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-22}}
}
.side .gh{margin-top:4px}
.chips{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:550;font-size:14.5px;touch-action:pan-x;white-space:nowrap;user-select:none;-webkit-user-select:none}

#trayBox{border-radius:14px;transition:background .2s}

.picking{margin:0 0 10px;padding:10px 12px;border-radius:10px;background:var(--accent);color:var(--on);font-size:14.5px}

.tl .r{min-height:50px}
.fly{position:fixed;z-index:80;width:32px;height:32px;margin:0;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font:750 11px var(--sans);pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 6px 16px rgba(60,20,40,.3)}

.trayh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between}

.gcs{padding:6px 0 4px}

input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--surface);border:3px solid var(--accent)}
.gcends{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:6px}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.verdict{font-size:17px;margin:0 0 18px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--paper)}
.nums.gc dd{font-size:24px}
/* sharing */
.steps{margin:0 0 6px;padding-left:22px;max-width:66ch}.steps li{margin:0 0 6px}
.card2{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.qrbox{background:#fff;border-radius:12px;padding:6px;width:min(100%,380px);margin:6px auto 0}
.qrbox svg{display:block;width:100%;height:auto}
.qrn{text-align:center;color:var(--muted);font-size:14px;margin:8px 0}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:1/1;max-width:380px;margin:6px auto 0}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.aim{position:absolute;inset:14%;border:3px solid rgba(255,255,255,.85);border-radius:14px}
.slots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:10px}
.slots i{width:14px;height:14px;border-radius:4px;background:var(--line);display:block}
.slots i.on{background:var(--ok)}

/* ---------- edit sheet and dialogs ---------- */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(30,10,20,.3)}
dialog::backdrop{background:rgba(25,12,18,.38)}
#sheet{margin:0 0 0 auto;height:100%;max-height:none;width:min(460px,100vw);border-radius:18px 0 0 18px}
#sheet[open]{animation:sideIn .32s var(--ease)}
@keyframes sideIn{from{transform:translateX(40px);opacity:0}}
.sh{display:flex;flex-direction:column;height:100%}
.sh header{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 10px}
.sh header h2{font-size:22px}
.sh header h2::first-letter{text-transform:uppercase}
.grab{display:none}
.fields{flex:1;overflow:auto;padding:6px 20px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}
.sh footer{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sh footer .primary{margin-left:auto;min-width:96px;justify-content:center}
.money{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding-left:12px}
.money span{color:var(--muted)}
.money input{border:0;padding-left:6px;background:transparent}
.switch{display:flex!important;align-items:center;gap:10px;font-size:16px!important;color:var(--ink)!important;font-weight:500!important;min-height:44px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch span{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:background .2s;flex:none}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2.5px solid var(--accent);outline-offset:2px}
.rate{display:flex;gap:2px}
.rate button{border:0;background:none;padding:6px;color:var(--line)}
.rate button[aria-pressed="true"]{color:var(--accent2)}
.rate button[aria-pressed="true"] .ic{fill:currentColor}
.colorf{display:flex;align-items:center;gap:10px}
.colorf input{width:56px;height:44px;padding:3px}
#dlg{border-radius:18px;width:min(560px,94vw);max-height:90vh;overflow:auto}
#dlg[open]{animation:fadeUp .25s var(--ease)}
@keyframes fadeUp{from{transform:translateY(12px);opacity:0}}
.dl{padding:22px}
.wt{font-size:24px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:90;max-width:92vw;transition:opacity .2s,transform .25s var(--ease);font-size:15px}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{all:unset;cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* print summary */
.sheet-print{background:#fff;color:#222;border:1px solid var(--line);padding:28px;border-radius:6px}
.sheet-print h2{font:italic 500 30px var(--serif)}
.sheet-print h3{font-size:17px;margin:18px 0 6px}
.pcols{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.sheet-print table{width:100%;border-collapse:collapse;font-size:14px}
.sheet-print td{padding:5px 0;border-bottom:1px solid #eee;vertical-align:top}
.sheet-print td:last-child{text-align:right}
.sheet-print td small{color:#777}
.show-phone{display:none}

/* ---------- phone ---------- */
@media (max-width:900px){
 .app{display:block}
 #rail{display:none}
 main{padding:max(18px,env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
 .hide-phone{display:none!important}
 .show-phone{display:flex}
 #tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
 #tabs button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;font-size:11.5px;font-weight:650;color:var(--muted);border-radius:12px}
 #tabs button[aria-current]{color:var(--accent)}
 #tabs button[aria-current] .ic{stroke-width:2.2}
 #tabs button:focus-visible{outline:2.5px solid var(--accent)}
 #fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:41;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--on);box-shadow:0 8px 22px -6px rgba(90,30,50,.55)}
 #fab .ic{width:26px;height:26px;stroke-width:2.2}
 #fab[hidden]{display:none}
 .ph h1{font-size:28px}
 .pa .icbtn{width:38px;height:38px}
 .nums{grid-template-columns:repeat(2,1fr)}
 .nums div:nth-child(3){border-left:0;padding-left:2px}
 .nums div:nth-child(n+3){border-top:1px solid var(--line)}
 .cols{grid-template-columns:1fr;gap:0}
 .ledger{grid-template-columns:1fr;gap:10px}
 .ledger dl{gap:28px}
 .invite{margin-inline:-4px}
 .iv-in{padding:28px 14px 24px}
 .r{padding:0 12px;gap:10px}
 .rr{max-width:52%}
 .tools select{max-width:100%;flex:1}
 .search{max-width:none;flex-basis:100%}
 .form2{grid-template-columns:1fr 1fr}
 .form2 .fl:has(textarea){grid-column:1/-1}
 #sheet{margin:auto 0 0;width:100%;max-width:100%;height:auto;max-height:92vh;border-radius:22px 22px 0 0}
 #sheet[open]{animation:sheetUp .34s var(--ease)}
 @keyframes sheetUp{from{transform:translateY(60%)}}
 .grab{display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 0}
 .sh header{padding:8px 18px 6px}
 .fields{padding:6px 18px 18px;gap:12px}
 .sh footer .btn{flex:1;justify-content:center}
 .sh footer .primary{flex-basis:100%;order:-1;min-height:48px}
 #toast{bottom:calc(150px + env(safe-area-inset-bottom))}
 .cg button{min-height:52px;padding:5px;align-items:center}
 .cg .chips{display:none}
 .cg .dots{display:flex}
 .sched::before{left:72px}
 .sched li button{grid-template-columns:60px 1fr;gap:26px}
 .sched li button::after{left:68px}
 .sched li.cer button::after{left:66px}
 .sched time{font-size:16px}
 .seatwrap{grid-template-columns:minmax(0,1fr);grid-template-areas:"bar" "tray" "canvas" "side";grid-template-rows:auto;gap:8px}
 body.seatfull .seatwrap{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"bar" "canvas" "tray";padding:max(8px,env(safe-area-inset-top)) 0 calc(8px + env(safe-area-inset-bottom));gap:6px}
 body.seatfull .canvas{margin:0;border-radius:0}
 body.seatfull #trayBox{max-height:34vh;padding:0 16px}
 body.seatfull .seatbar .tools{margin-bottom:4px}
 .gchips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 8px;padding:2px 16px;scrollbar-width:none}
 .gchips li{flex:none}
 .canvas{height:62vh;margin:0 -16px;border-radius:0;border-left:0;border-right:0}
 .seatbar{display:block}
 .seatbar .tools{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 10px;padding:0 16px;scrollbar-width:none}
 .seatbar .tools::-webkit-scrollbar{display:none}
 .seatbar select{flex:none;width:auto}
 #tray.chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 6px;padding:4px 16px 8px;scrollbar-width:none}
 .chip{flex:none}
 .pcols{grid-template-columns:1fr}
 .sw{grid-template-columns:repeat(3,1fr);gap:12px}
 .sw i{width:76px;height:76px}
}
@media (max-width:420px){.fields{grid-template-columns:1fr}.fields .fl{grid-column:1/-1}}
@media print{
 #rail,#tabs,#fab,.ph .pa,#toast,.demo,.warn{display:none!important}
 .app{display:block} main{padding:0;max-width:none}
 body{background:#fff}
 .sheet-print{border:0;padding:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  var fs = SCHEMA[coll].fields, txt = [fs.map(function (f) { return f[1]; })].concat(S[coll].map(function (x) { return fs.map(function (f) { return displayVal(f, x); }); })).map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
  var name = "weddingops-" + SCHEMA[coll].one.replace(/\s+/g, "-") + "s.csv";
  toast(download(name, txt, "text/csv") ? "Saved " + name : "This browser could not save a file");
}
var ALIAS = { name: ["guest", "fullname", "guestname", "vendor", "hotel", "venue"], rsvp: ["status", "response", "rsvpstatus"], plus: ["plusones", "plusone", "extra"], grp: ["group", "relation", "relationship"], meal: ["mealchoice", "menu"],
  diet: ["dietary", "dietaryneeds", "allergies"], amount: ["sum", "cost"], due: ["duedate", "date"], label: ["whatfor", "description", "payment"], est: ["budgeted", "estimate", "budget"], cost: ["agreedtotal", "totalcost", "actual", "quote"], cat: ["category", "type"] };
function normH(s) { return String(s).toLowerCase().replace(/[^a-z]/g, ""); }
function mapHeaders(coll, h) {
  var fs = SCHEMA[coll].fields;
  return h.map(function (col) { var n = normH(col);
    for (var i = 0; i < fs.length; i++) { var f = fs[i]; if (normH(f[1]) === n || normH(f[0]) === n) return f; }
    for (i = 0; i < fs.length; i++) { f = fs[i]; if ((ALIAS[f[0]] || []).indexOf(n) > -1) return f; }
    return null; });
}
function coerce(f, raw, x) {
  var v = String(raw || "").trim(), t = f[2];
  if (t === "check") return /^(y|yes|true|1|✓|x|paid|done)/i.test(v);
  if (NUMERIC[t]) return Math.max(0, num(v));
  if (t === "date") { var m = v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/); if (m) v = m[3] + "-" + pad(+m[2]) + "-" + pad(+m[1]); return parse(v) ? v : ""; }
  if (t === "table") { var tb = S.tables.filter(function (z) { return z.name.toLowerCase() === v.toLowerCase(); })[0]; return tb ? tb.id : ""; }
  if (t === "vendor") { var vv = S.vendors.filter(function (z) { return String(z.name).toLowerCase() === v.toLowerCase(); })[0]; return vv ? vv.id : ""; }
  if (t === "daytime") { var mm = toMin(v); if (mm != null) x.off = mm - ceremonyMin(); return undefined; }
  if (f[0] === "rsvp") return /accept|yes|attend|confirm|coming/i.test(v) ? "Accepted" : /declin|^no|cannot|not/i.test(v) ? "Declined" : "Pending";
  if (t === "sel" || t === "seg") { var o = f[3].filter(function (op) { return op.toLowerCase() === v.toLowerCase(); })[0]; return o || (f[0] === "side" ? (/b|groom/i.test(v) && !/both/i.test(v) ? "Partner B" : /both/i.test(v) ? "Both" : "Partner A") : f[3][0]); }
  return v;
}
function csvIn(coll, text) {
  var rows = csvParse(text); if (rows.length < 2) return "No rows found. The first row must be the column headings.";
  var map = mapHeaders(coll, rows[0]), pk = primaryKey(coll);
  if (!map.some(Boolean)) return "None of the headings matched. Useful headings: " + SCHEMA[coll].fields.slice(0, 5).map(function (f) { return f[1]; }).join(", ") + ".";
  snap(); var n = 0;
  rows.slice(1).forEach(function (r) { var x = newItem(coll); map.forEach(function (f, i) { if (!f) return; var v = coerce(f, r[i], x); if (v !== undefined) x[f[0]] = v; });
    if (String(x[pk] || "").trim() || coll === "payments") { S[coll].push(x); n++; } });
  save(); render(); toast("Imported " + plural(n, "row"), true); return "";
}
function csvInDlg(coll) {
  dialog('<h2 class="wt">Import ' + esc(SCHEMA[coll].one) + 's</h2><p class="para">Save a tab of your spreadsheet as CSV, or copy the rows (with the heading row) and paste them here. Rows are added to what you already have. Headings it understands: ' + esc(SCHEMA[coll].fields.map(function (f) { return f[1]; }).join(", ")) + '.</p><div class="tools"><button class="btn" data-d="file">Choose CSV file</button></div><textarea id="ci" rows="6" placeholder="Or paste rows here" aria-label="Rows to import"></textarea><p class="err" id="cim" role="alert"></p><div class="tools end"><button class="btn" data-d="no">Cancel</button><button class="btn primary" data-d="go">Import</button></div>', function (a) {
    if (a === "no") return closeDlg();
    var run = function (t) { var m = csvIn(coll, t); if (m) $("#cim").textContent = m; else closeDlg(); };
    if (a === "file") pickFile(".csv,text/csv,text/plain", run); else run($("#ci").value);
  });
}

/* ============ events ============ */
var deferredInstall = null;
window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferredInstall = e; var b = $("#installBtn"); if (b) b.hidden = false; });
function setS(path, v, el) { var p = path.split("."); snap(); S[p[0]][p[1]] = (el && el.type === "number") ? Math.max(0, num(v)) : v; save(); render(); }
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-go],[data-add],[data-edit],[data-tick],[data-cycle],[data-ui],[data-act],[data-month],[data-day],[data-pal],[data-segf],[data-ratef],[data-sact]");
  if (!el) return;
  var a;
  if ((a = el.getAttribute("data-go")) !== null) {
    if (a.indexOf("edit:") === 0) { var p = a.slice(5).split("."); openEdit(p[0], p[1]); return; }
    if (el.getAttribute("data-plist")) ui.plist = el.getAttribute("data-plist");
    closeSheet(); go(a); return;
  }
  if ((a = el.getAttribute("data-add"))) { addNew(a); return; }
  if ((a = el.getAttribute("data-edit"))) { var q = a.split("."); openEdit(q[0], q[1]); return; }
  if ((a = el.getAttribute("data-tick"))) { var t = a.split("."), x = byId(S[t[0]], t[1]); if (!x) return; snap(); x[t[2]] = !x[t[2]]; save(); render(); toast(x[t[2]] ? "Ticked off" : "Unticked", true); return; }
  if ((a = el.getAttribute("data-cycle"))) { var c = a.split("."), g = byId(S[c[0]], c[1]); if (!g) return; snap(); var order = ["Pending", "Accepted", "Declined"]; g.rsvp = order[(order.indexOf(g.rsvp) + 1) % 3]; if (g.rsvp !== "Accepted") g.table = ""; save(); render(); toast(g.name + ": " + g.rsvp, true); return; }
  if ((a = el.getAttribute("data-ui"))) { var v = el.getAttribute("data-v"); if (a === "mode") { snap(); S.theme.mode = v; applyTheme(); save(); } else ui[a] = v; if (a === "gf") { $("#glist").innerHTML = guestRows(); $$('[data-ui="gf"]').forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-v") === v); }); return; } render(); return; }
  if ((a = el.getAttribute("data-pal"))) { snap(); S.theme.pal = a; applyTheme(); save(); render(); return; }
  if ((a = el.getAttribute("data-month"))) { if (a === "wed") { var w = wDate(); ui.month = w.getFullYear() * 12 + w.getMonth(); ui.selDay = iso(w); } else ui.month += +a; render(); return; }
  if ((a = el.getAttribute("data-day"))) { ui.selDay = a; render(); return; }
  if ((a = el.getAttribute("data-segf"))) { sheetSet(a, el.getAttribute("data-v")); $$('[data-segf="' + a + '"]').forEach(function (b) { b.setAttribute("aria-pressed", b === el); }); return; }
  if ((a = el.getAttribute("data-ratef"))) { var n = +el.getAttribute("data-v"); sheetSet(a, n); $$('[data-ratef="' + a + '"]').forEach(function (b) { b.setAttribute("aria-pressed", +b.getAttribute("data-v") <= n); }); return; }
  if ((a = el.getAttribute("data-sact"))) {
    e.preventDefault(); var it = byId(S[sheet.coll], sheet.id); if (!it) return;
    if (a === "delete") { var cl = sheet.coll; if (!sheet.dirty && !sheet.isNew) snap(); S[cl] = S[cl].filter(function (y) { return y.id !== it.id; });
      if (cl === "vendors") S.payments.forEach(function (pp) { if (pp.vendor === it.id) pp.vendor = ""; }); if (cl === "tables") S.guests.forEach(function (gg) { if (gg.table === it.id) gg.table = ""; });
      save(); sheet = { coll: null }; $("#sheet").onclose = null; $("#sheet").close(); render(); toast("Deleted " + SCHEMA[cl].one, true); return; }
    if (a.indexOf("unseat:") === 0) { var ug = byId(S.guests, a.slice(7)); if (ug) { if (!sheet.dirty) snap(); sheet.dirty = true; ug.table = ""; save(); el.closest("li").remove(); } return; }
    if (a === "to-vendor") { snap(); it.chosen = true; S.vendors.push({ id: uid(), name: it.name, cat: it.cat, status: "Booked", est: quoteTotal(it), cost: quoteTotal(it), contract: false, contact: "", phone: "", email: "", web: "", notes: it.included || "" }); save(); closeSheet(); toast(it.name + " added to vendors", true); return; }
    if (a === "add-pay") { var vid = it.id; closeSheet(); snap(); var np = newItem("payments"); np.vendor = vid; S.payments.push(np); save(); openEdit("payments", np.id, true); return; }
  }
  if ((a = el.getAttribute("data-act"))) {
    if (a === "undo") return undo();
    if (a === "backup") return backup(); if (a === "restore") return restore(); if (a === "print") return window.print();
    if (a.indexOf("csv-in:") === 0) return csvInDlg(a.slice(7) === "?" ? $("#csvColl").value : a.slice(7));
    if (a.indexOf("csv-out:") === 0) return csvOut(a.slice(8) === "?" ? $("#csvColl").value : a.slice(8));
    if (a === "install") { if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; el.hidden = true; } return; }
    if (a === "add-appt") return addNew("appts");
    if (a === "load-demo") return confirmBox("Replace your plan with the sample plan for Ava and Liam? You can undo this straight after.", "Load sample plan", function () { snap(); var th = S.theme; S = demo(); S.theme = th; save(); render(); toast("Sample plan loaded", true); });
    if (a === "erase") return confirmBox("Erase every guest, vendor, payment and tick, and start a blank plan? You can undo this straight after.", "Erase and start again", function () { snap(); var th = S.theme; S = blank(); S.theme = th; save(); go("settings"); toast("Plan erased", true); });
    if (a.indexOf("sync-") === 0) return syncAct(a);
    if (a.indexOf("gc-") === 0) { ui.gn = +a.slice(3); gcUpdate(); var sl = $("#gcN"); if (sl) sl.value = ui.gn; return; }
    seatingAct(a, el);
  }
});
document.addEventListener("input", function (e) {
  var el = e.target;
  if (el.id === "gcN") { ui.gn = +el.value; gcUpdate(); return; }
  if (el.id === "gq") { ui.gq = el.value; $("#glist").innerHTML = guestRows(); return; }

window.addEventListener("hashchange", function () { var h = location.hash.slice(1); if (VIEWS[h] && h !== view) { view = h; render(); } });

(function start() { var h = location.hash.slice(1); if (VIEWS[h]) view = h; })();

loadState().then(function (o) {

  else { S = blank(); applyTheme(); render(); welcome(); }
});
